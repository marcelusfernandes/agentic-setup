# issue-lint — validates an issue's contract before it can be dispatched,
# with five checks: the required sections present and non-empty (including
# the optional `Declaration:` line of `## Proof`, which must name a
# `proof/<slug>.json` path when it is there); every glob in `## Files`
# parsing and matching a tracked file, or being new; every `authorised:`
# grant in that section held to that same rule, and named as a grant rather
# than a bullet glob when it fails (#232); those globs *and* grants disjoint
# from the issues already in flight in the same milestone, since a granted
# file is a file that pull request may touch; and every
# `Blocked by: #N` number naming an issue that exists. It reads no diff:
# the entry-point check — every file the issue's globs cover grepped for
# other tracked files that reference it by path or basename — was removed
# in M4 (#62), because it could not tell a rename from an in-place edit and
# fired on every ordinary import or mention; see `ci/issue-lint.mts:14-19`.
# The shape it aimed at is caught at PR time instead, by `scope`'s
# dangling-reference rule. Runs only once the issue carries a milestone (a
# milestone is set right after triage; running before that would just fail
# AC1's "not applicable yet" cases with noise).
#
# Fetches the other open issues in the same milestone with `gh`, then runs
# the lint with the file-flag inputs (no further `gh` needed except AC5's
# per-number existence check), and creates or updates its own comment on
# the issue — found by the `<!-- agentic-issue-lint -->` marker the lint's
# `--markdown` output starts with, so an edit never produces a second
# comment.

name: issue-lint

on:
  issues:
    types: [opened, edited, milestoned]

concurrency:
  group: issue-lint-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  lint:
    if: github.event.issue.milestone != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # 22.18+ runs the .mts scripts directly
      - name: gather milestone issues
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ github.event.issue.milestone.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > issue-body.md
          gh issue list --milestone "$MILESTONE" --state open --limit 500 --json number,labels,body > milestone-issues.json
      - name: issue-lint
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          node .github/scripts/agentic/issue-lint.mts --issue "$ISSUE" \
            --issue-body-file issue-body.md \
            --milestone-issues-file milestone-issues.json \
            --markdown > comment.md
      - name: comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [ -s comment.md ] || exit 0
          # REST, not `gh issue view --json comments` (GraphQL node ids), so
          # the id matches what the PATCH below (also REST) expects.
          existing="$(gh api "repos/{owner}/{repo}/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- agentic-issue-lint -->"))][0].id // empty')"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/{owner}/{repo}/issues/comments/$existing" -F body=@comment.md
          else
            gh issue comment "$ISSUE" --body-file comment.md
          fi
