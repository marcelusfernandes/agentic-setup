# guard-main — the detection layer of main protection.
#
# A ruleset blocks direct pushes on the server when your plan allows one;
# this action covers the case where it does not (private repository, free
# plan). If a commit that lands on main belongs to no PR, it opens an issue
# labelled `human:pending` and fails, so the history turns red and someone
# looks. The label is created first (idempotently) so a repository that
# never re-ran `init` after the label split does not fail here instead.
#
# The commit -> PR lookup retries up to 4 times, 15 seconds apart (about 45s
# of tolerance): right after a squash merge the association can still be
# unindexed, so a single call risks a false `human:pending` issue for a
# commit that did come from a PR (#80). A `gh api` error (as opposed to a
# confirmed empty list) is retried the same way; crash policy: if it still
# errors on the last attempt, the run still fails and opens an issue, but
# the body says the lookup failed rather than claiming a confirmed direct
# push. The call's stdout and stderr are captured apart, so a warning `gh`
# prints on an otherwise successful attempt cannot turn a "0 PR(s)" or
# "N PR(s)" answer into "unexpected response"; stderr is echoed only when
# the attempt did not produce a clean numeric answer (#207).
#
# Crash policy of the failure path: a `gh label create` or `gh issue create`
# that fails there is reported as a `::warning::` and the step still fails
# with its `::error::`, so the run is red and says why no `human:pending`
# issue was opened.
#
# This file and `templates/.github/workflows/guard-main.yml` (the copy `init`
# ships to adopting repositories) are pinned byte-identical by
# `tests/guard-main.test.mts`, which also runs the step below against a fake
# `gh`: edit one copy and the test fails until both match again.
#
# Declared exception: a commit whose message contains "[allow-push-main]"
# (bootstrap only).

name: guard-main

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Did this commit come from a PR?
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$MSG" in *"[allow-push-main]"*) echo "bootstrap declared; ok"; exit 0;; esac

          attempts=4
          wait_seconds=15
          last="error"
          stderr_file="$(mktemp)"
          trap 'rm -f "$stderr_file"' EXIT
          for attempt in $(seq 1 "$attempts"); do
            if out="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length' 2>"$stderr_file")"; then
              case "$out" in
                ''|*[!0-9]*)
                  echo "attempt $attempt/$attempts: unexpected response: $out"
                  if [ -s "$stderr_file" ]; then
                    echo "attempt $attempt/$attempts: stderr: $(cat "$stderr_file")"
                  fi
                  last="error"
                  ;;
                0)
                  echo "attempt $attempt/$attempts: 0 PR(s)"
                  last="empty"
                  ;;
                *)
                  echo "attempt $attempt/$attempts: $out PR(s)"
                  echo "commit $SHA belongs to $out PR(s); ok"
                  exit 0
                  ;;
              esac
            else
              echo "attempt $attempt/$attempts: gh api error: $(cat "$stderr_file")${out:+ (stdout: $out)}"
              last="error"
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$wait_seconds"
            fi
          done

          title="Direct push to main without a PR ($ACTOR, ${SHA:0:7})"
          exists="$(gh issue list --repo "$REPO" --search "\"$title\" in:title" --state open --json number --jq 'length')"
          if [ "$exists" = "0" ]; then
            if ! gh label create human:pending --repo "$REPO" --color f9d0c4 \
              --description "A human decision is required; affected work is paused" --force; then
              echo "::warning::label create failed: human:pending is not in place, so the issue below may carry no label"
            fi
            if [ "$last" = "empty" ]; then
              body="Commit \`$SHA\` reached \`main\` without a PR (actor: $ACTOR). Check what came in and revert through a PR if needed. See docs/decisions.md §9 of the agentic-setup plugin."
            else
              body="Commit \`$SHA\` reached \`main\` (actor: $ACTOR), but the commit-to-PR lookup failed ($attempts attempts, ${wait_seconds}s apart; the last one errored), so this is not a confirmed direct push. Check by hand and revert through a PR if needed. See docs/decisions.md §9 of the agentic-setup plugin."
            fi
            if ! gh issue create --repo "$REPO" --title "$title" --label human:pending --body "$body"; then
              echo "::warning::issue create failed: no human:pending issue was opened for $SHA; the run fails below anyway"
            fi
          fi
          echo "::error::direct push to main without a PR ($SHA)"; exit 1
