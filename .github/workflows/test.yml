# test — this repository's own gate: types and the test suite, run on Node.
# Runs on every PR and on main after a merge.
# `negative-control` runs the same `npm test` on the PR's base with the PR's
# test files applied.
# The checkout takes `fetch-depth: 0` because `tests/provenance.test.mts` asserts
# ancestry: every merge commit a `docs/closeout/M<n>.md` lists must be reachable
# from `main` (`git merge-base --is-ancestor`), which the default shallow
# checkout has no history for. The job is otherwise unchanged, so `test` stays
# the one required check name.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: node tests/run.mts
